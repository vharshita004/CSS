<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>

         .aa {
            border: 1px dotted rgb(35, 122, 199);
            text-decoration: none;
            color: rgb(218, 229, 6);
            background-color: rgb(233, 233, 217);
            box-shadow: 5px 5px 5px rgb(145, 148, 9);
            padding: 10px;
            font-family: verdana;
            border-radius: 5px;
            display: inline-block;
        }
        
        #x, #z {
            box-shadow: 5px 5px 10px rgb(31, 117, 31);
        } 
        /* there can be more element in which we want to apply box shadow */
        
    </style>
</head>

<body>
    <a href="http://apple.com" id="x" class="aa">Click here for Apple</a>

    <br><br>
    
    <a href="http://orange.com">Click here for Orange</a>

    <br><br>
    
    <a href="http://isrdc.com" id="y" class="aa">Click here for ISRDC</a>

    <br><br>

    <a href="http://irctc.com" >Click here for IRCTC</a>

    <br><br>
    
    <a href="http://facebook.com" id="z" class="aa">Click here for Facebook</a>
</body>

</html>
