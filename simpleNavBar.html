<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
     <style>

        * {
            padding : 0px;
            margin : 0px;
            color : white;
        }

        .a {
            text-decoration : none;
        }

        a {
            margin-right : 200px;
        }

        #nav {
            height : 60px;
            background-color : #0f1111;
        }

        #logo {
          color : #f08804;
          font-size : 25px;
          text-decoration : none;
        
        }

        #btn {
            background-color : #f08804;
            color : white;
        }
     </style>
</head>
<body>
    <div id="nav">
        <a href="http://www.amazon.in" id="logo">amazon.in</a>

        <a href="#signup" class="a">Account</a>

        <a href="#my_cart" class="a">My Cart</a>

        <a href="#contact_us" class="a">Contact Us</a>

        <input type="search" id="s" value="search in Amazon">
        <input type="button" value="Search" id="btn">
    </div>
</body>
</html>
